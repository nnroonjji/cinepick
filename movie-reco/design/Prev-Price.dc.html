<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>예산 선택</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Nunito:wght@800&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3a3330}a:hover{color:#000}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f6ebb8; color: #3a3330; font-family: 'Noto Sans KR', system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column">
<div style="height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0">
<a href="Prev-Pref.dc.html" aria-label="뒤로" style="font-size: 22px; line-height: 1; padding: 4px 6px; color: #3a3330; text-decoration: none">←</a>
<span style="font-size: 11px; color: #6f6659">3 / 3</span>
</div>
<div style="flex: 1; min-height: 0; padding: 8px 24px 124px; display: flex; flex-direction: column; gap: 14px">
<svg width="88" height="88" viewBox="0 0 64 64" aria-hidden="true" style="margin-top: auto; align-self: center; flex-shrink: 0"><circle cx="22" cy="22" r="10" fill="#fff6d6" stroke="#8f6b6b" stroke-width="2"></circle><circle cx="36" cy="16" r="10" fill="#fff6d6" stroke="#8f6b6b" stroke-width="2"></circle><circle cx="46" cy="26" r="9" fill="#fff6d6" stroke="#8f6b6b" stroke-width="2"></circle><circle cx="30" cy="27" r="9" fill="#fff6d6" stroke="#8f6b6b" stroke-width="2"></circle><path d="M14 30h36l-4 28H18z" fill="#fff" stroke="#8f6b6b" stroke-width="2"></path><path d="M22 30l2 28M32 30v28M42 30l-2 28" stroke="#efb1b8" stroke-width="5"></path><circle cx="27" cy="42" r="1.8" fill="#3a3330"></circle><circle cx="37" cy="42" r="1.8" fill="#3a3330"></circle><path d="M29 47q3 3 6 0" stroke="#3a3330" stroke-width="1.6" fill="none" stroke-linecap="round"></path><circle cx="23" cy="46" r="2" fill="#efb1b8"></circle><circle cx="41" cy="46" r="2" fill="#efb1b8"></circle></svg>
<h2 style="margin: 0; font-family: 'Jua', 'Noto Sans KR', sans-serif; font-weight: 400; font-size: 22px; text-align: center">예산을 선택하세요</h2>
<p style="margin: 0; font-size: 12px; color: #6f6659; text-align: center">티켓 1인 기준. 독립영화관·조조·할인 포함해서 찾음</p>
<div style="background: #fffdf7; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.06)">
<div style="display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: #6f6659"><span>최대</span><b style="color: #3a3330; font-size: 16px">{{priceText}}</b></div>
<input type="range" min="5000" max="20000" step="1000" value="{{price}}" onInput="{{onPrice}}" aria-label="최대 예산" style="width: 100%; accent-color: #e3b23c">
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #6f6659"><span>5,000원</span><span>20,000원</span></div>
</div>

<div style="margin-top: auto"></div>
<a href="Prev-Reco.dc.html" style="position: absolute; left: 24px; right: 24px; bottom: 40px; z-index: 2; display: flex; align-items: center; justify-content: center; border-radius: 999px; padding: 18px 24px; background: #e3b23c; color: #fffdf7; font-weight: 700; font-size: 15px; text-decoration: none; box-shadow: 0 6px 14px rgba(120,90,10,.18)"><span>추천 받기</span><span style="position: absolute; right: 22px; font-size: 18px">→</span></a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { price: 10000 };
}
renderVals() {
var self = this;
var p = this.state.price;
var hint = p < 8000 ? '독립영화관 조조·청년 할인 위주로 찾음' : p < 13000 ? '독립영화관 일반 요금과 멀티플렉스 조조까지 포함' : '멀티플렉스 일반·특별관까지 모두 포함';
return {
price: p,
priceText: p.toLocaleString('ko-KR') + '원',
hint: hint,
onPrice: function (e) { self.setState({ price: +e.target.value }); }
};
}
}
</script>
</body>
</html>
