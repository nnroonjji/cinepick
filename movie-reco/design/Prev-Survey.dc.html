<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>설문 인트로</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Nunito:wght@800&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3a3330}a:hover{color:#000}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f6ebb8; color: #3a3330; font-family: 'Noto Sans KR', system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column">
<div style="height: 48px; display: flex; align-items: center; padding: 0 20px; flex-shrink: 0">
<a href="Prev-Login.dc.html" aria-label="뒤로" style="font-size: 22px; line-height: 1; padding: 4px 6px; color: #3a3330; text-decoration: none">←</a>
</div>
<div style="flex: 1; min-height: 0; padding: 8px 24px 124px; display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center">
<svg width="{{mascot}}" height="{{mascot}}" viewBox="0 0 64 64" aria-hidden="true" style="flex-shrink: 0; {{mascotGap}}"><circle cx="22" cy="22" r="10" fill="#fff6d6" stroke="#8f6b6b" stroke-width="2"></circle><circle cx="36" cy="16" r="10" fill="#fff6d6" stroke="#8f6b6b" stroke-width="2"></circle><circle cx="46" cy="26" r="9" fill="#fff6d6" stroke="#8f6b6b" stroke-width="2"></circle><circle cx="30" cy="27" r="9" fill="#fff6d6" stroke="#8f6b6b" stroke-width="2"></circle><path d="M14 30h36l-4 28H18z" fill="#fff" stroke="#8f6b6b" stroke-width="2"></path><path d="M22 30l2 28M32 30v28M42 30l-2 28" stroke="#efb1b8" stroke-width="5"></path><circle cx="27" cy="42" r="1.8" fill="#3a3330"></circle><circle cx="37" cy="42" r="1.8" fill="#3a3330"></circle><path d="M29 47q3 3 6 0" stroke="#3a3330" stroke-width="1.6" fill="none" stroke-linecap="round"></path><circle cx="23" cy="46" r="2" fill="#efb1b8"></circle><circle cx="41" cy="46" r="2" fill="#efb1b8"></circle></svg>
<h1 style="margin: 0; font-family: 'Jua', 'Noto Sans KR', sans-serif; font-weight: 400; font-size: {{titleSize}}px; line-height: 1.2; color: #3a3330">맞춤 영화 추천을 위해<br>설문을 진행합니다</h1>

<sc-if value="{{showArrow}}" hint-placeholder-val="{{ true }}">
<div aria-hidden="true" style="flex-shrink: 0; {{arrowBox}}; background: linear-gradient(180deg, rgba(227,178,60,0) 0%, rgba(227,178,60,.5) 100%); clip-path: polygon(25% 0, 75% 0, 75% 55%, 100% 55%, 50% 100%, 0 55%, 25% 55%)"></div>
</sc-if>
<div style="{{endGap}}"></div>
<a href="Prev-Mbti.dc.html" style="position: absolute; left: 24px; right: 24px; bottom: 40px; z-index: 2; display: flex; align-items: center; justify-content: center; border-radius: 999px; padding: 18px 24px; background: #e3b23c; color: #fffdf7; font-weight: 700; font-size: 15px; text-decoration: none; box-shadow: 0 6px 14px rgba(120,90,10,.18)"><span>설문 시작하기</span><span style="position: absolute; right: 22px; font-size: 18px">→</span></a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;균등 분배&quot;,&quot;위쪽 정렬&quot;,&quot;아래쪽 정렬&quot;],&quot;default&quot;:&quot;아래쪽 정렬&quot;,&quot;section&quot;:&quot;배치&quot;},&quot;mascotSize&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:48,&quot;max&quot;:160,&quot;step&quot;:4,&quot;unit&quot;:&quot;px&quot;,&quot;default&quot;:128,&quot;section&quot;:&quot;비율&quot;},&quot;titleSize&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:18,&quot;max&quot;:36,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;default&quot;:24,&quot;section&quot;:&quot;비율&quot;},&quot;showArrow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;화살표&quot;},&quot;arrowWidth&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:30,&quot;max&quot;:100,&quot;step&quot;:2,&quot;unit&quot;:&quot;%&quot;,&quot;default&quot;:88,&quot;section&quot;:&quot;화살표&quot;},&quot;arrowRatio&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.8,&quot;max&quot;:2.6,&quot;step&quot;:0.1,&quot;default&quot;:1.6,&quot;section&quot;:&quot;화살표&quot;},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
renderVals() {
var p = this.props;
var layout = p.layout ?? '균등 분배';
var m = { mascotGap: 'margin-top: auto', arrowGap: 'margin-top: auto', endGap: 'margin-top: auto' };
if (layout === '위쪽 정렬') m = { mascotGap: 'margin-top: 24px', arrowGap: 'margin-top: 28px', endGap: 'margin-top: auto' };
if (layout === '아래쪽 정렬') m = { mascotGap: 'margin-top: auto', arrowGap: 'margin-top: 20px', endGap: 'margin-top: 8px' };
return {
mascot: p.mascotSize ?? 128,
mascotGap: m.mascotGap,
titleSize: p.titleSize ?? 24,
showArrow: p.showArrow ?? true,
arrowBox: 'width: ' + (p.arrowWidth ?? 88) + '%; aspect-ratio: ' + (p.arrowRatio ?? 1.6) + '; ' + m.arrowGap,
endGap: m.endGap
};
}
}
</script>
</body>
</html>
