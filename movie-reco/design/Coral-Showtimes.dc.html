<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>다른 회차 보기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Nunito:wght@800&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3a3330}a:hover{color:#000}
.rail::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:0;height:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #fbf1e6; color: #3a3330; font-family: 'Noto Sans KR', system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column">

<div style="height: 52px; display: flex; align-items: center; padding: 0 12px; flex-shrink: 0">
<a href="Coral-Booking.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: grid; place-items: center; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3a3330" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
</div>

<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 0 24px 18px; flex-shrink: 0">
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
<h1 style="margin: 0; font-family: 'Jua', 'Noto Sans KR', sans-serif; font-weight: 400; font-size: 30px; line-height: 1.15">언제 볼까요?</h1>
<span style="font-size: 13px; color: #6f6659">최종면접 · 예산 10,000원 이하 <a href="Coral-Price.dc.html" style="color: #3a3330; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; margin-left: 2px">바꾸기</a></span>
</div>
<img src="../posters/final-interview.jpg" alt="최종면접 포스터" style="width: 48px; height: 68px; border-radius: 6px; object-fit: cover; flex-shrink: 0; transform: rotate(4deg); box-shadow: 0 6px 12px rgba(40,25,10,.22)">
</div>

<div style="flex-shrink: 0; border-top: 1px solid #e6dcc4; border-bottom: 1px solid #e6dcc4; padding: 10px 0 8px">
<div class="rail" style="display: flex; align-items: stretch; overflow-x: auto; padding: 0 16px">
<span style="flex-shrink: 0; writing-mode: vertical-rl; font-size: 11px; font-weight: 700; color: #6f6659; padding: 4px 6px 0 0">11월</span>
<sc-for list="{{dates}}" as="d" hint-placeholder-count="7">
<button type="button" aria-pressed="{{d.pressed}}" aria-label="{{d.aria}}" onClick="{{d.pick}}" style="flex: 0 0 48px; min-height: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: none; padding: 0; font: inherit; cursor: pointer">
<span style="font-size: 11px; color: {{d.dowColor}}">{{d.dow}}</span>
<sc-if value="{{d.on}}" hint-placeholder-val="{{ false }}">
<span style="width: 34px; height: 34px; border-radius: 50%; background: #3a3330; color: #fffdf7; display: grid; place-items: center; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums">{{d.day}}</span>
</sc-if>
<sc-if value="{{d.off}}" hint-placeholder-val="{{ true }}">
<span style="width: 34px; height: 34px; display: grid; place-items: center; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; color: {{d.numColor}}">{{d.day}}</span>
</sc-if>
<span style="width: 4px; height: 4px; border-radius: 50%; background: {{d.dot}}"></span>
</button>
</sc-for>
</div>
</div>

<div class="scroll" style="flex: 1; min-height: 0; overflow-y: auto; padding: 6px 16px 120px; display: flex; flex-direction: column">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<div style="flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 18px 8px 8px">
<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s-7-6.6-7-12a7 7 0 0 1 14 0c0 5.4-7 12-7 12z" fill="#d9546d"></path><circle cx="12" cy="10" r="2.6" fill="#fbf1e6"></circle></svg>
<b style="font-size: 15px">{{g.theater}}</b>
<span style="font-size: 12px; color: #6f6659">{{g.area}}</span>
</div>
<sc-for list="{{g.shows}}" as="s" hint-placeholder-count="2">
<sc-if value="{{s.on}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-pressed="true" onClick="{{s.pick}}" style="flex-shrink: 0; min-height: 60px; display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 0 12px 0 10px; border: 0; border-radius: 12px; background: #3a3330; color: #fffdf7; font: inherit; text-align: left; cursor: pointer">
<span style="font-family: 'Jua', 'Noto Sans KR', sans-serif; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums">{{s.time}}</span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 13px; display: flex; align-items: center; gap: 6px">{{s.hall}}<sc-if value="{{s.early}}" hint-placeholder-val="{{ false }}"><span style="font-size: 10px; font-weight: 700; color: #3a3330; background: #efb1b8; border-radius: 4px; padding: 0 5px">조조</span></sc-if></span><span style="font-size: 11px; opacity: .75">잔여 {{s.seats}}석</span></span>
<span style="font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums">{{s.priceText}}</span>
</button>
</sc-if>
<sc-if value="{{s.off}}" hint-placeholder-val="{{ true }}">
<button type="button" aria-pressed="false" onClick="{{s.pick}}" style="flex-shrink: 0; min-height: 60px; display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 0 12px 0 10px; border: 0; border-bottom: 1px dashed #e0d5ba; border-radius: 0; background: none; color: #3a3330; font: inherit; text-align: left; cursor: pointer">
<span style="font-family: 'Jua', 'Noto Sans KR', sans-serif; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums">{{s.time}}</span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 13px; display: flex; align-items: center; gap: 6px">{{s.hall}}<sc-if value="{{s.early}}" hint-placeholder-val="{{ false }}"><span style="font-size: 10px; font-weight: 700; color: #3a3330; background: #efb1b8; border-radius: 4px; padding: 0 5px">조조</span></sc-if></span><span style="font-size: 11px; color: #6f6659">잔여 {{s.seats}}석</span></span>
<span style="font-size: 14px; font-variant-numeric: tabular-nums">{{s.priceText}}</span>
</button>
</sc-if>
</sc-for>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 48px 16px 0; text-align: center">
<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="22" cy="22" r="10" fill="#fff6d6" stroke="#8f6b6b" stroke-width="2"></circle><circle cx="36" cy="16" r="10" fill="#fff6d6" stroke="#8f6b6b" stroke-width="2"></circle><circle cx="46" cy="26" r="9" fill="#fff6d6" stroke="#8f6b6b" stroke-width="2"></circle><circle cx="30" cy="27" r="9" fill="#fff6d6" stroke="#8f6b6b" stroke-width="2"></circle><path d="M14 30h36l-4 28H18z" fill="#fff" stroke="#8f6b6b" stroke-width="2"></path><path d="M22 30l2 28M32 30v28M42 30l-2 28" stroke="#efb1b8" stroke-width="5"></path><circle cx="27" cy="43" r="1.8" fill="#3a3330"></circle><circle cx="37" cy="43" r="1.8" fill="#3a3330"></circle><path d="M29 50q3-3 6 0" stroke="#3a3330" stroke-width="1.6" fill="none" stroke-linecap="round"></path></svg>
<b style="font-size: 15px">이 날은 예산 안에 맞는 회차가 없어요</b>
<span style="font-size: 13px; color: #6f6659">다른 날짜를 고르거나 <a href="Coral-Price.dc.html" style="color: #3a3330; font-weight: 700; text-underline-offset: 3px">예산을 바꿔</a> 보세요</span>
</div>
</sc-if>
<sc-if value="{{hasHidden}}" hint-placeholder-val="{{ true }}">
<p style="flex-shrink: 0; margin: 18px 8px 0; font-size: 12px; color: #6f6659">{{hiddenText}}</p>
</sc-if>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; background: #fffdf7; border-top: 1px solid #e6dcc4; padding: 12px 16px 34px 24px; display: flex; align-items: center; gap: 12px">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<b style="font-size: 15px; font-variant-numeric: tabular-nums">{{sel.line1}}</b>
<span style="font-size: 12px; color: #6f6659; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{sel.line2}}</span>
</div>
<a href="Coral-Booking.dc.html" style="flex-shrink: 0; min-height: 52px; display: flex; align-items: center; padding: 0 26px; border-radius: 999px; background: #d9695a; color: #fffdf7; font-weight: 700; font-size: 15px; text-decoration: none; box-shadow: 0 6px 14px rgba(150,60,45,.25)">예약하기</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { date: '11.02', key: '11.02 13:35' };
}
renderVals() {
var self = this;
var budget = 10000;
var area = { '상상마당 시네마': '홍대', '라이카시네마': '연희동', '에무시네마': '경희궁길' };
var data = [
{ label: '11.02', dow: '월', shows: [['13:35', '상상마당 시네마', '2관', 10000, 41], ['16:10', '상상마당 시네마', '1관', 10000, 12], ['19:00', '라이카시네마', '1관', 12000, 30], ['20:40', '에무시네마', '2관', 9000, 55], ['21:50', '상상마당 시네마', '2관', 10000, 63]] },
{ label: '11.03', dow: '화', shows: [['10:20', '라이카시네마', '1관', 8000, 38], ['15:00', '상상마당 시네마', '2관', 10000, 27], ['19:30', '상상마당 시네마', '2관', 13000, 9], ['17:40', '라이카시네마', '1관', 10000, 21]] },
{ label: '11.04', dow: '수', shows: [['14:10', '에무시네마', '1관', 9000, 44], ['18:50', '라이카시네마', '1관', 10000, 6]] },
{ label: '11.05', dow: '목', shows: [['10:00', '상상마당 시네마', '1관', 8000, 70], ['21:00', '상상마당 시네마', '2관', 10000, 48], ['16:30', '에무시네마', '2관', 9000, 33]] },
{ label: '11.06', dow: '금', shows: [['19:20', '라이카시네마', '1관', 12000, 14]] },
{ label: '11.07', dow: '토', shows: [['09:50', '상상마당 시네마', '1관', 8000, 22], ['13:10', '라이카시네마', '1관', 10000, 3], ['15:50', '에무시네마', '1관', 10000, 18], ['18:20', '상상마당 시네마', '2관', 12000, 11]] },
{ label: '11.08', dow: '일', shows: [['10:40', '에무시네마', '2관', 8000, 40], ['14:40', '상상마당 시네마', '2관', 10000, 25]] }
];
var won = function (n) { return n.toLocaleString('ko-KR') + '원'; };
var fits = function (d) { return d.shows.filter(function (s) { return s[3] <= budget; }); };
var dates = data.map(function (d) {
var on = d.label === self.state.date;
var n = fits(d).length;
var dowColor = d.dow === '토' ? '#3d6fb6' : d.dow === '일' ? '#c4443f' : '#6f6659';
return {
day: String(+d.label.slice(3)), dow: d.dow, on: on, off: !on, pressed: on ? 'true' : 'false',
aria: '11월 ' + (+d.label.slice(3)) + '일 ' + d.dow + '요일, 예산 안 ' + n + '회',
dowColor: dowColor, numColor: n ? '#3a3330' : '#c3b9a3', dot: n ? '#d9546d' : 'transparent',
pick: function () { self.setState({ date: d.label }); }
};
});
var day = data.filter(function (d) { return d.label === self.state.date; })[0] || data[0];
var fit = fits(day).sort(function (a, b) { return a[0] < b[0] ? -1 : 1; });
var hidden = day.shows.length - fit.length;
var order = [], byT = {}, sel = null;
fit.forEach(function (s) { if (!byT[s[1]]) { byT[s[1]] = []; order.push(s[1]); } byT[s[1]].push(s); });
var groups = order.map(function (t) {
return {
theater: t, area: area[t],
shows: byT[t].map(function (s) {
var key = day.label + ' ' + s[0];
var on = key === self.state.key;
if (on) sel = { line1: day.label + ' (' + day.dow + ') ' + s[0], line2: s[1] + ' ' + s[2] + ' · ' + won(s[3]) };
return { time: s[0], hall: s[2] + ' · 2D', seats: s[4], early: s[0] < '11:00', priceText: won(s[3]), on: on, off: !on, pick: function () { self.setState({ key: key }); } };
})
};
});
return {
dates: dates, groups: groups, empty: groups.length === 0,
hasHidden: hidden > 0, hiddenText: '예산을 넘는 회차 ' + hidden + '개는 뺐어요',
sel: sel || { line1: '회차를 골라 주세요', line2: '시간을 누르면 여기에 표시돼요' }
};
}
}
</script>
</body>
</html>
