<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Login</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Nunito:wght@800&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3a3330}a:hover{color:#000}
input::placeholder{color:#b3aa9a;letter-spacing:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #fffdf7; color: #3a3330; font-family: 'Noto Sans KR', system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column">
<div style="height: 48px; display: flex; align-items: center; padding: 0 18px; flex-shrink: 0">
<a href="Main.dc.html" aria-label="뒤로" style="font-size: 22px; line-height: 1; padding: 4px 6px; color: #3a3330; text-decoration: none">←</a>
</div>
<sc-if value="{{isNew}}" hint-placeholder-val="{{ true }}">
<div style="flex: 1; min-height: 0; padding: 0 24px 124px; display: flex; flex-direction: column; justify-content: center">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 16px">
<svg width="72" height="72" viewBox="0 0 64 64" aria-hidden="true" style="display: block; flex-shrink: 0; margin-left: -4px"><circle cx="22" cy="22" r="10" fill="#fff6d6" stroke="#8f6b6b" stroke-width="2"></circle><circle cx="36" cy="16" r="10" fill="#fff6d6" stroke="#8f6b6b" stroke-width="2"></circle><circle cx="46" cy="26" r="9" fill="#fff6d6" stroke="#8f6b6b" stroke-width="2"></circle><circle cx="30" cy="27" r="9" fill="#fff6d6" stroke="#8f6b6b" stroke-width="2"></circle><path d="M14 30h36l-4 28H18z" fill="#fff" stroke="#8f6b6b" stroke-width="2"></path><path d="M22 30l2 28M32 30v28M42 30l-2 28" stroke="#efb1b8" stroke-width="5"></path><circle cx="27" cy="42" r="1.8" fill="#3a3330"></circle><circle cx="37" cy="42" r="1.8" fill="#3a3330"></circle><path d="M29 47q3 3 6 0" stroke="#3a3330" stroke-width="1.6" fill="none" stroke-linecap="round"></path><circle cx="23" cy="46" r="2" fill="#efb1b8"></circle><circle cx="41" cy="46" r="2" fill="#efb1b8"></circle></svg>
<h1 style="margin: 0; font-family: 'Jua', 'Noto Sans KR', sans-serif; font-weight: 400; font-size: 28px; line-height: 1.25; color: #3a3330">씨네픽에 오신 것을<br>환영합니다!</h1>
</div>
<p style="margin: 14px 0 0; font-size: 13px; color: #6f6659">닉네임과 PIN 4자리면 끝. 처음 쓰는 닉네임이면 바로 가입돼요</p>
<div style="margin-top: 36px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="nick" style="font-size: 13px; font-weight: 700">닉네임 <small style="font-weight: 400; font-size: 12px; color: #6f6659; margin-left: 4px">2~12자</small></label>
<input id="nick" placeholder="닉네임 입력" maxlength="12" style="width: 100%; height: 52px; box-sizing: border-box; border: 1px solid #e8dfc4; background: #faf6ea; border-radius: 12px; padding: 0 16px; font: inherit; font-size: 15px; color: #3a3330; outline: none">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="pin" style="font-size: 13px; font-weight: 700">PIN 4자리 <small style="font-weight: 400; font-size: 12px; color: #6f6659; margin-left: 4px">숫자만</small></label>
<input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="숫자 4자리" style="width: 100%; height: 52px; box-sizing: border-box; border: 1px solid #e8dfc4; background: #faf6ea; border-radius: 12px; padding: 0 16px; font: inherit; font-size: 15px; letter-spacing: 6px; color: #3a3330; outline: none">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="pin2" style="font-size: 13px; font-weight: 700">PIN 번호 확인</label>
<input id="pin2" type="password" inputmode="numeric" maxlength="4" placeholder="한 번 더 입력" style="width: 100%; height: 52px; box-sizing: border-box; border: 1px solid #e8dfc4; background: #faf6ea; border-radius: 12px; padding: 0 16px; font: inherit; font-size: 15px; letter-spacing: 6px; color: #3a3330; outline: none">
</div>
</div>
</div>
</sc-if>
<sc-if value="{{isOld}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; min-height: 0; padding: 0 24px 124px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; justify-content: center">
<svg width="80" height="80" viewBox="0 0 64 64" aria-hidden="true"><circle cx="22" cy="22" r="10" fill="#fff6d6" stroke="#8f6b6b" stroke-width="2"></circle><circle cx="36" cy="16" r="10" fill="#fff6d6" stroke="#8f6b6b" stroke-width="2"></circle><circle cx="46" cy="26" r="9" fill="#fff6d6" stroke="#8f6b6b" stroke-width="2"></circle><circle cx="30" cy="27" r="9" fill="#fff6d6" stroke="#8f6b6b" stroke-width="2"></circle><path d="M14 30h36l-4 28H18z" fill="#fff" stroke="#8f6b6b" stroke-width="2"></path><path d="M22 30l2 28M32 30v28M42 30l-2 28" stroke="#efb1b8" stroke-width="5"></path><circle cx="27" cy="42" r="1.8" fill="#3a3330"></circle><circle cx="37" cy="42" r="1.8" fill="#3a3330"></circle><path d="M29 47q3 3 6 0" stroke="#3a3330" stroke-width="1.6" fill="none" stroke-linecap="round"></path><circle cx="23" cy="46" r="2" fill="#efb1b8"></circle><circle cx="41" cy="46" r="2" fill="#efb1b8"></circle></svg>
<h1 style="margin: 0; font-family: 'Jua', 'Noto Sans KR', sans-serif; font-weight: 400; font-size: 26px; line-height: 1.2; color: #3a3330">씨네픽에 오신 것을<br>환영합니다!</h1>
<p style="margin: -6px 0 14px; font-size: 12px; color: #6f6659">닉네임과 PIN 4자리면 끝. 처음 쓰는 닉네임이면 바로 가입돼요</p>
<div style="width: 100%; display: flex; flex-direction: column; gap: 6px">
<label for="nick-o" style="font-size: 12px; font-weight: 700">닉네임 <small style="font-weight: 400; color: #6f6659; margin-left: 4px">2~12자</small></label>
<input id="nick-o" placeholder="닉네임" maxlength="12" style="width: 100%; box-sizing: border-box; border: 1.5px solid #e2d8c2; background: #fffdf7; border-radius: 12px; padding: 12px 14px; font: inherit; font-size: 15px; color: #3a3330; outline: none">
<p style="margin: 0; font-size: 11px; color: #5c8a4a; min-height: 14px">새 닉네임이에요. PIN을 정하면 바로 가입돼요</p>
</div>
<div style="width: 100%; display: flex; flex-direction: column; gap: 6px">
<label for="pin-o" style="font-size: 12px; font-weight: 700">PIN 4자리 <small style="font-weight: 400; color: #6f6659; margin-left: 4px">숫자만</small></label>
<input id="pin-o" type="password" inputmode="numeric" maxlength="4" placeholder="••••" style="width: 100%; box-sizing: border-box; border: 1.5px solid #e2d8c2; background: #fffdf7; border-radius: 12px; padding: 12px 14px; font: inherit; font-size: 20px; letter-spacing: 10px; color: #3a3330; outline: none">
</div>
<div style="width: 100%; display: flex; flex-direction: column; gap: 6px">
<label for="pin2-o" style="font-size: 12px; font-weight: 700">PIN 확인 <small style="font-weight: 400; color: #6f6659; margin-left: 4px">가입할 때만</small></label>
<input id="pin2-o" type="password" inputmode="numeric" maxlength="4" placeholder="••••" style="width: 100%; box-sizing: border-box; border: 1.5px solid #e2d8c2; background: #fffdf7; border-radius: 12px; padding: 12px 14px; font: inherit; font-size: 20px; letter-spacing: 10px; color: #3a3330; outline: none">
</div>
</div>
</sc-if>
<a href="Survey.dc.html" style="position: absolute; left: 24px; right: 24px; bottom: 40px; z-index: 2; display: flex; align-items: center; justify-content: center; border-radius: 999px; padding: 18px 24px; background: #2b2622; color: #fffdf7; font-weight: 700; font-size: 15px; text-decoration: none; box-shadow: 0 6px 14px rgba(43,38,34,.22)"><span>가입하기</span><span style="position: absolute; right: 22px; font-size: 18px">→</span></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;version&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;새 버전&quot;,&quot;이전 버전&quot;],&quot;default&quot;:&quot;이전 버전&quot;},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
renderVals() {
var v = this.props.version ?? '새 버전';
return { isNew: v !== '이전 버전', isOld: v === '이전 버전' };
}
}
</script>
</body>
</html>
