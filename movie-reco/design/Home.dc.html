<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { q: '', show: { multi: true, indie: true, culture: true, visited: true } };
}
renderVals() {
const show = this.state.show;
const suggest = [
{ label: '혼자 잔잔하게', text: '홍대에서 혼자 볼 잔잔한 영화' },
{ label: '만 원 이하', text: '만 원 이하로 볼 수 있는 영화' },
{ label: '이번 주 GV', text: '이번 주에 GV 있는 영화' },
{ label: '친구랑 웃긴 거', text: '친구랑 보기 좋은 웃긴 영화' }
].map((s) => ({ ...s, pick: () => this.setState({ q: s.text }) }));
const cats = [
{ id: 'multi', label: '멀티플렉스', color: '#3a3330' },
{ id: 'indie', label: '독립영화관', color: '#d9546d' },
{ id: 'culture', label: '문화공간', color: '#6f7fa3' },
{ id: 'visited', label: '가 본 곳', color: '#8f6b6b' }
].map((c) => ({
...c,
on: !!show[c.id],
off: !show[c.id],
toggle: () => this.setState({ show: { ...this.state.show, [c.id]: !this.state.show[c.id] } })
}));
const op = {};
Object.keys(show).forEach((k) => { op[k] = show[k] ? 1 : 0.15; });
return {
q: this.state.q,
onQ: (e) => this.setState({ q: e.target.value }),
suggest,
cats,
op
};
}
}
</script>
