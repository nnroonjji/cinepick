<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>취향 영화 선택</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Nunito:wght@800&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3a3330}a:hover{color:#000}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f7f1e3; color: #3a3330; font-family: 'Noto Sans KR', system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column">
<div style="height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0">
<a href="Mbti.dc.html" aria-label="뒤로" style="font-size: 22px; line-height: 1; padding: 4px 6px; color: #3a3330; text-decoration: none">←</a>
<span style="font-size: 11px; color: #6f6659">2 / 3</span>
</div>
<div style="flex: 1; min-height: 0; padding: 8px 24px 124px; display: flex; flex-direction: column; gap: 14px">
<svg width="88" height="88" viewBox="0 0 64 64" aria-hidden="true" style="margin-top: auto; align-self: center; flex-shrink: 0"><circle cx="22" cy="22" r="10" fill="#fff6d6" stroke="#8f6b6b" stroke-width="2"></circle><circle cx="36" cy="16" r="10" fill="#fff6d6" stroke="#8f6b6b" stroke-width="2"></circle><circle cx="46" cy="26" r="9" fill="#fff6d6" stroke="#8f6b6b" stroke-width="2"></circle><circle cx="30" cy="27" r="9" fill="#fff6d6" stroke="#8f6b6b" stroke-width="2"></circle><path d="M14 30h36l-4 28H18z" fill="#fff" stroke="#8f6b6b" stroke-width="2"></path><path d="M22 30l2 28M32 30v28M42 30l-2 28" stroke="#efb1b8" stroke-width="5"></path><circle cx="27" cy="42" r="1.8" fill="#3a3330"></circle><circle cx="37" cy="42" r="1.8" fill="#3a3330"></circle><path d="M29 47q3 3 6 0" stroke="#3a3330" stroke-width="1.6" fill="none" stroke-linecap="round"></path><circle cx="23" cy="46" r="2" fill="#efb1b8"></circle><circle cx="41" cy="46" r="2" fill="#efb1b8"></circle></svg>
<h2 style="margin: 0; font-family: 'Jua', 'Noto Sans KR', sans-serif; font-weight: 400; font-size: 22px; text-align: center">재미있게 봤던 영화를 골라주세요</h2>
<p style="margin: 0; font-size: 12px; color: #6f6659; text-align: center">여러 개 선택 가능 · {{count}}개 선택됨</p>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 10px">
<sc-for list="{{movies}}" as="m" hint-placeholder-count="6">
<button type="button" onClick="{{m.toggle}}" aria-pressed="{{m.pressed}}" style="background: none; border: 0; padding: 0; font: inherit; color: #3a3330; display: flex; flex-direction: column; gap: 6px; cursor: pointer; text-align: center">
<span style="position: relative; display: block; width: 100%; aspect-ratio: 3/4; border-radius: 10px; overflow: hidden; box-sizing: border-box; {{m.frame}}">
<sc-if value="{{m.hasImg}}" hint-placeholder-val="{{ true }}">
<img src="{{m.img}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block">
</sc-if>
<sc-if value="{{m.noImg}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; inset: 0; display: flex; align-items: flex-end; padding: 8px; color: #fff; font-family: 'Jua', 'Noto Sans KR', sans-serif; font-size: 15px; line-height: 1.1; text-align: left; {{m.bg}}">{{m.title}}</span>
</sc-if>
<sc-if value="{{m.on}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; background: #3a3330; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.2)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
</sc-if>
</span>
<span style="font-size: 11px; font-weight: 700; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{m.title}}</span>
</button>
</sc-for>
</div>
<div style="margin-top: auto"></div>
<a href="Price.dc.html" style="position: absolute; left: 24px; right: 24px; bottom: 40px; z-index: 2; display: flex; align-items: center; justify-content: center; border-radius: 999px; padding: 18px 24px; background: #2b2622; color: #fffdf7; font-weight: 700; font-size: 15px; text-decoration: none; box-shadow: 0 6px 14px rgba(43,38,34,.22)"><span>다음</span><span style="position: absolute; right: 22px; font-size: 18px">→</span></a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { on: { '벌새': 1, '최종면접': 1 } };
}
renderVals() {
var self = this;
var defs = [
{ title: '극장판 치이카와: 인어 섬의 비밀', img: '../posters/chiikawa.jpg' },
{ title: '하트 오브 비스트', img: '../posters/heart-of-the-beast.jpg' },
{ title: '최종면접', img: '../posters/final-interview.jpg' },
{ title: '벌새', bg: 'linear-gradient(160deg,#efb1b8,#8f6b6b)' },
{ title: '소공녀', bg: 'linear-gradient(160deg,#e3b23c,#8f6b6b)' },
{ title: '남매의 여름밤', bg: 'linear-gradient(160deg,#8b98b5,#3d4c6e)' }
];
var on = this.state.on;
var movies = defs.map(function (d) {
var sel = !!on[d.title];
return {
title: d.title,
img: d.img || '',
hasImg: !!d.img,
noImg: !d.img,
bg: 'background: ' + (d.bg || '#b9bbc0'),
on: sel,
pressed: sel ? 'true' : 'false',
frame: sel ? 'border: 3px solid #3a3330; box-shadow: 0 4px 12px rgba(43,38,34,.22)' : 'border: 3px solid transparent; box-shadow: 0 2px 6px rgba(0,0,0,.1)',
toggle: function () { var n = Object.assign({}, self.state.on); if (n[d.title]) delete n[d.title]; else n[d.title] = 1; self.setState({ on: n }); }
};
});
return { movies: movies, count: Object.keys(on).length };
}
}
</script>
</body>
</html>
