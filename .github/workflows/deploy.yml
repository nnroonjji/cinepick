# 매일 새벽 KOBIS 상영표를 새로 받아 태그와 schedule.js를 다시 만들고 GitHub Pages에 올림
# 코드를 push해도, Actions 탭에서 Run workflow를 눌러도 같은 일을 함
# 필요한 것: 저장소 Settings → Secrets → Actions에 KMDB_KEY (KMDb API 키), SUPABASE_URL, SUPABASE_KEY (계정 저장. 표와 함수는 data/supabase.sql)
name: refresh-and-deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 20 * * *'  # 매일 05:00 한국 시간
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      KMDB_KEY: ${{ secrets.KMDB_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}  # publishable(anon) 키만. secret(service_role) 키는 절대 넣지 않음
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/deploy.yml
      - run: pip install pandas kiwipiepy lemminflect
      - name: 상영표 새로 받기
        id: refresh
        continue-on-error: true
        working-directory: data
        run: |
          test -n "$KMDB_KEY" || { echo "::error::KMDB_KEY secret이 없음"; exit 1; }
          python kobis_fetch.py
          RAW=$(ls raw/kobis_raw_*.json | tail -1)
          (cd 상영작 && python kmdb_fetch.py now && python tag_movies.py now)
          python build_schedule.py "$RAW"
          python build_reco_tags.py "$RAW"
          (cd ../movie-reco && node reco.test.js)
      # 새로 받기가 실패하면: 정해진 시각 실행은 어제 올린 사이트를 그대로 두고, push는 저장소에 있는 상영표로 올림
      - if: steps.refresh.outcome == 'failure'
        run: git checkout -- .
      - name: 올릴 파일 모으기
        if: steps.refresh.outcome == 'success' || github.event_name != 'schedule'
        run: |
          mkdir _site
          cp -r movie-reco/index.html movie-reco/style.css movie-reco/app.js movie-reco/reco.js movie-reco/mascot.png movie-reco/data movie-reco/posters _site/
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
            echo "const SUPABASE_URL='$SUPABASE_URL',SUPABASE_KEY='$SUPABASE_KEY';" > _site/data/config.js
          else
            echo "::warning::SUPABASE_URL, SUPABASE_KEY secret이 없어 계정이 브라우저에만 저장됨"
          fi
          sed -i 's/<html lang="ko">/<html lang="ko" data-theme-lock="prev">/' _site/index.html  # 테마 고르는 줄 없이 테마 고정
      - if: steps.refresh.outcome == 'success' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
      - if: steps.refresh.outcome == 'success' || github.event_name != 'schedule'
        id: deploy
        uses: actions/deploy-pages@v4
      - if: steps.refresh.outcome == 'failure'
        run: echo "::error::상영표 새로 받기 실패. 위 단계 로그 확인" && exit 1
