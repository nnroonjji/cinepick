name: recommendation-checks
on:
  pull_request:
    branches: [main]
    paths: ['movie-reco/**', 'supabase/**', '.github/workflows/test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recommendation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: supabase/tests/package-lock.json
      - run: npm ci --prefix supabase/tests --ignore-scripts
      - run: node movie-reco/reco.test.js
      - run: node --test supabase/functions/recommend/handler.test.mjs supabase/functions/recommend/rate-limit.test.mjs
      - run: npm --prefix supabase/tests test
