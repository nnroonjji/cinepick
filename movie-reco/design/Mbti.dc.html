<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>MBTI 선택</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Nunito:wght@800&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3a3330}a:hover{color:#000}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f7f1e3; color: #3a3330; font-family: 'Noto Sans KR', system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column">
<div style="height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0">
<a href="Survey.dc.html" aria-label="뒤로" style="font-size: 22px; line-height: 1; padding: 4px 6px; color: #3a3330; text-decoration: none">←</a>
<span style="font-size: 11px; color: #6f6659">1 / 3</span>
</div>
<div style="flex: 1; min-height: 0; padding: 8px 24px 124px; display: flex; flex-direction: column; gap: 14px">
<svg width="88" height="88" viewBox="0 0 64 64" aria-hidden="true" style="margin-top: auto; align-self: center; flex-shrink: 0"><circle cx="22" cy="22" r="10" fill="#fff6d6" stroke="#8f6b6b" stroke-width="2"></circle><circle cx="36" cy="16" r="10" fill="#fff6d6" stroke="#8f6b6b" stroke-width="2"></circle><circle cx="46" cy="26" r="9" fill="#fff6d6" stroke="#8f6b6b" stroke-width="2"></circle><circle cx="30" cy="27" r="9" fill="#fff6d6" stroke="#8f6b6b" stroke-width="2"></circle><path d="M14 30h36l-4 28H18z" fill="#fff" stroke="#8f6b6b" stroke-width="2"></path><path d="M22 30l2 28M32 30v28M42 30l-2 28" stroke="#efb1b8" stroke-width="5"></path><circle cx="27" cy="42" r="1.8" fill="#3a3330"></circle><circle cx="37" cy="42" r="1.8" fill="#3a3330"></circle><path d="M29 47q3 3 6 0" stroke="#3a3330" stroke-width="1.6" fill="none" stroke-linecap="round"></path><circle cx="23" cy="46" r="2" fill="#efb1b8"></circle><circle cx="41" cy="46" r="2" fill="#efb1b8"></circle></svg>
<h2 style="margin: 0; font-family: 'Jua', 'Noto Sans KR', sans-serif; font-weight: 400; font-size: 22px; text-align: center">MBTI를 선택하세요</h2>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; margin: 16px 2px 6px">
<sc-for list="{{axes}}" as="a" hint-placeholder-count="4">
<div style="aspect-ratio: 1/2; border-radius: 18px; background: linear-gradient(180deg, #f6f6f4 0%, #efefec 100%); box-shadow: 0 2px 4px rgba(60,55,40,.08); display: flex; flex-direction: column">
<button type="button" onClick="{{a.pickL}}" aria-pressed="{{a.lOn}}" style="flex: 1; border: 0; padding: 0; font-family: 'Nunito', sans-serif; font-weight: 800; line-height: 1; cursor: pointer; {{a.lStyle}}">{{a.l}}</button>
<button type="button" onClick="{{a.pickR}}" aria-pressed="{{a.rOn}}" style="flex: 1; border: 0; padding: 0; font-family: 'Nunito', sans-serif; font-weight: 800; line-height: 1; cursor: pointer; {{a.rStyle}}">{{a.r}}</button>
</div>
</sc-for>
</div>

<div style="font-family: 'Jua', 'Noto Sans KR', sans-serif; font-size: 40px; color: #3a3330; text-align: center; letter-spacing: 6px; min-height: 52px">{{out}}</div>
<div style="margin-top: auto"></div>
<a href="Pref.dc.html" style="position: absolute; left: 24px; right: 24px; bottom: 40px; z-index: 2; display: flex; align-items: center; justify-content: center; border-radius: 999px; padding: 18px 24px; color: #fffdf7; font-weight: 700; font-size: 15px; text-decoration: none; box-shadow: 0 6px 14px rgba(43,38,34,.22); background-color: #2b2622"><span>다음</span><span style="position: absolute; right: 22px; font-size: 18px">→</span></a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { pick: ['I', 'N', 'F', 'P'] };
}
renderVals() {
var self = this;
var defs = [['I', 'E'], ['S', 'N'], ['T', 'F'], ['J', 'P']];
var on = 'position: relative; z-index: 1; margin: 0; border-radius: 18px; background: #3a3330; color: #fffdf7; font-size: 40px; box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 3px 6px rgba(43,38,34,.25)';
var off = 'border-radius: 18px; background: transparent; color: #75767a; font-size: 40px';
var pick = this.state.pick;
var axes = defs.map(function (d, i) {
var set = function (v) { return function () { var p = self.state.pick.slice(); p[i] = v; self.setState({ pick: p }); }; };
return {
l: d[0], r: d[1],
lOn: pick[i] === d[0] ? 'true' : 'false', rOn: pick[i] === d[1] ? 'true' : 'false',
lStyle: pick[i] === d[0] ? on : off, rStyle: pick[i] === d[1] ? on : off,
pickL: set(d[0]), pickR: set(d[1])
};
});
return { axes: axes, out: pick.join(' ') };
}
}
</script>
</body>
</html>
