# 매일 새벽 KOBIS 상영표를 새로 받아 태그와 schedule.js를 다시 만들고 GitHub Pages에 올림
# Actions 탭에서 Run workflow를 눌러도 같은 일을 함. 코드를 push하면 상영표는 새로 받지 않고 지금 사이트의 것을 그대로 쓰고 코드만 바꿔 올림
# (상영표나 태그 만드는 스크립트를 고쳤으면 push 뒤에 Run workflow를 한 번 눌러야 반영됨)
# 필요한 것: 저장소 Settings → Secrets → Actions에 KMDB_KEY (KMDb API 키), SUPABASE_URL, SUPABASE_KEY (계정 저장. 표와 함수는 data/supabase.sql)
name: refresh-and-deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 20 * * *'  # 매일 05:00 한국 시간
    - cron: '0 22 * * *'  # 07:00에 한 번 더 (05:00에 KOBIS가 멈췄을 때 대비)
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      KMDB_KEY: ${{ secrets.KMDB_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}  # publishable(anon) 키만. secret(service_role) 키는 절대 넣지 않음
      PYTHONUTF8: 1
    steps:
      # Supabase 무료 프로젝트는 일주일 동안 요청이 없으면 멈춤. 매일 한 번 불러서 깨워 둠
      - if: env.SUPABASE_URL != ''
        continue-on-error: true
        run: |
          curl -fsS -X POST "${SUPABASE_URL%/}/rest/v1/rpc/cp_exists" -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{"p_nick":"keepalive"}'
      - uses: actions/checkout@v4
      - if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/deploy.yml
      - if: github.event_name != 'push'
        run: pip install pandas kiwipiepy lemminflect pillow
      # 선명한 상영작 포스터 파일(poster_fetch.py가 만듦)은 저장소 대신 캐시에 둠. 매번 새 이름으로 저장해 새로 받은 것이 쌓이게 함
      - uses: actions/cache@v4
        with:
          path: movie-reco/posters/now
          key: posters-${{ github.run_id }}
          restore-keys: posters-
      - name: 상영표 새로 받기
        id: refresh
        timeout-minutes: 50  # 보통 2~4분. KOBIS가 GitHub 서버에 느리게 답하는 날은 상영표 받기만 18분 걸림(11/14). 새벽에 도는 거라 오래 걸려도 됨
        if: github.event_name != 'push'
        continue-on-error: true
        working-directory: data
        run: |
          test -n "$KMDB_KEY" || { echo "::error::KMDB_KEY secret이 없음"; exit 1; }
          # KOBIS에서 못 받으면 저장소에 올려 둔 원본(PC에서 받아 올린 것)을 씀. 3일 넘게 지난 것이면 쓰지 않고 실패
          python kobis_fetch.py || echo "::warning::KOBIS에서 상영표를 못 받아 저장소에 있는 원본을 씀"
          RAW=$(ls raw/kobis_raw_*.json | tail -1)
          AGE=$(( ( $(TZ=Asia/Seoul date +%s) - $(date -d "$(basename "$RAW" .json | tail -c 9)" +%s) ) / 86400 ))
          echo "상영표 원본: $RAW (${AGE}일 전)"
          test "$AGE" -le 3
          python poster_fetch.py "$RAW" || echo "::warning::포스터 파일 만들기 실패. 주소로 대신 씀"
          (cd 상영작 && python kmdb_fetch.py now && python tag_movies.py now)
          python build_schedule.py "$RAW"
          python build_reco_tags.py "$RAW"
          (cd ../movie-reco && node reco.test.js)
      - name: 코드만 올릴 때는 지금 사이트의 상영표와 태그를 그대로 씀
        if: github.event_name == 'push'
        run: |
          SITE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data"
          if curl -fsS "$SITE/schedule.js" -o /tmp/schedule.js && curl -fsS "$SITE/tags.js" -o /tmp/tags.js; then
            cp /tmp/schedule.js /tmp/tags.js movie-reco/data/
            (cd movie-reco && node reco.test.js) || git checkout -- movie-reco/data
          fi
      # 새로 받기가 실패하면 아무것도 올리지 않고 지금 사이트를 그대로 둠
      - if: steps.refresh.outcome == 'failure'
        run: git checkout -- .  # 캐시에서 온 포스터 파일은 그대로 남음
      - name: 올릴 파일 모으기
        if: steps.refresh.outcome != 'failure'
        run: |
          mkdir _site
          cp -r movie-reco/index.html movie-reco/style.css movie-reco/app.js movie-reco/reco.js movie-reco/mascot.png movie-reco/data movie-reco/posters _site/
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
            echo "const SUPABASE_URL='$SUPABASE_URL',SUPABASE_KEY='$SUPABASE_KEY';" > _site/data/config.js
          else
            echo "::warning::SUPABASE_URL, SUPABASE_KEY secret이 없어 계정이 브라우저에만 저장됨"
          fi
          sed -i 's/<html lang="ko">/<html lang="ko" data-theme-lock="prev">/' _site/index.html  # 테마 고르는 줄 없이 테마 고정
      - if: steps.refresh.outcome != 'failure'
        uses: actions/upload-pages-artifact@v3
      - if: steps.refresh.outcome != 'failure'
        id: deploy
        uses: actions/deploy-pages@v4
      - if: steps.refresh.outcome == 'failure'
        run: echo "::error::상영표 새로 받기 실패. 위 단계 로그 확인" && exit 1
